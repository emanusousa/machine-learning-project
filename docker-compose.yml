version: '3'

services:
  fastapi:
    build:
      context: ./fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./fastapi:/app

  jupyter:
    build:
      context: ./notebooks
      dockerfile: Dockerfile
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    environment:
      JUPYTER_TOKEN: "mlproject"
    command: start-notebook.sh --NotebookApp.token='mlproject'