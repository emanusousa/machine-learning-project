services:
  fastapi:
    build:
      context: ./fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./fastapi:/app

  jupyter:
    build:
      context: ./notebooks
      dockerfile: Dockerfile
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    environment:
      JUPYTER_TOKEN: "mlproject"
    command: start-notebook.sh --NotebookApp.token='mlproject'

  thingsboard:
    image: thingsboard/tb-postgres:3.3.4
    container_name: thingsboard
    restart: always
    ports:
      - "8080:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://thingsboard-postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: thingsboard
      SPRING_DATASOURCE_PASSWORD: thingsboard
    depends_on:
      - thingsboard-postgres
    volumes:
      - thingsboard_data:/data
      - thingsboard_logs:/var/log/thingsboard

  thingsboard-postgres:
    image: postgres:14
    container_name: thingsboard-postgres
    restart: always
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: thingsboard
      POSTGRES_PASSWORD: thingsboard
    volumes:
      - tb_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  tb-loader:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./thingsboard:/app
      - ./data:/data
    command: >
      sh -c "
      pip install -r requirements.txt >/dev/null 2>&1 || true;
      echo '[TB-LOADER] Aguardando ThingsBoard (60s)...';
      sleep 60;
      python csv_to_thingsboard.py;
      "
    environment:
      CSV_PATH: /data/raw/heart.csv
      THINGSBOARD_URL: http://thingsboard:9090
      THINGSBOARD_DEVICE_ACCESS_TOKEN: KzODJ2qEXZIknI1qVn0A
      MLFLOW_URL: ""
    depends_on:
      thingsboard:
        condition: service_started

  heart-ingest:
    image: curlimages/curl:8.11.0
    depends_on:
      tb-loader:
        condition: service_completed_successfully
      fastapi:
        condition: service_started
      thingsboard:
        condition: service_started
    command: >
      sh -c "
      echo '[HEART-INGEST] tb-loader finalizado, iniciando ingest...';
      curl -X POST http://fastapi:8000/ingest/heart
      "
    environment:
      THINGSBOARD_URL: http://thingsboard:9090
      THINGSBOARD_DEVICE_ID: 37f2e300-d093-11f0-8a69-fbf8c35e0488

volumes:
  thingsboard_data:
  thingsboard_logs:
  tb_pgdata:
